[language-server.ruff]
command = "uvx"
args = ["ruff", "server", "--preview"]

[language-server.ty]
command = "uvx"
args= ["ty", "server"]

[language-server.ty.config]
inlayHints = { variableTypes = false, callArgumentNames = false }

[language-server.drafty]
command = "drafty"
args = ["lsp"]

[language-server.tinymist]
command = "tinymist"

[language-server.bash-lsp]
command = "bunx"
args = ["--bunx", "bash-language-server", "start"]

[language-server.copilot]
command = "copilot-language-server"
args = ["--stdio"]

[language-server.copilot.config]
editorPluginInfo = { name = "helix-inline-completion", version = "0.1.0" }

[language-server.copilot.config.github.copilot]
enable = { "*" = true }
advanced = {}

[language-server.copilot.config.telemetry]
telemetryLevel = "off"

[language-server.deno-lsp]
command = "deno"
args = ["lsp"]
config.deno.enable = true

[language-server.typescript-language-server]
command = "tsgo"
args = ["--lsp", "--stdio"]

# From https://github.com/helix-editor/helix/issues/15134#issuecomment-3912058992
[language-server.typescript-language-server.config.typescript]
updateImportsOnFileMove.enabled = "always"
suggest.completeFunctionCalls = true
tsserver.enableTracing = true
inlayHints.parameterNames.enabled = "all"
inlayHints.parameterTypes.enabled = true
inlayHints.variableTypes.enabled = true
inlayHints.propertyDeclarationTypes.enabled = true
inlayHints.functionLikeReturnTypes = true
inlayHints.enumMemberValues.enabled = true
format.enable = false
format.semicolons = "remove"
preferences.importModuleSpecifier = "non-relative"
preferences.importModuleSpecifierEnding = "auto"
tsserver.pluginPaths = ["typescript-plugin-css-modules", "./node_modules"]
tsserver.experimental.enableProjectDiagnostics = true

#############
# Languages #
#############

[[language]]
name = "python"
language-servers = ["ruff", "ty", "copilot"]
auto-format = true

[[language]]
name = "latex"
language-servers = ["drafty", "texlab", "copilot"]


[[language]]
name = "typst"
language-servers = ["drafty", "tinymist", "copilot"]


[[language]]
name = "bash"
language-servers = ["bash-lsp", "copilot"]


[[language]]
name = "rust"
language-servers = ["rust-analyzer", "copilot"]


[[language]]
name = "go"
# Install golangci-lint-langserver with:
# go install github.com/nametake/golangci-lint-langserver@latest
language-servers = ["gopls", "golangci-lint-lsp", "copilot"]


[[language]]
name = "typescript"
roots = ["deno.json", "deno.jsonc", "package.json"]
file-types = ["ts", "tsx"]
auto-format = true
language-servers = ["deno-lsp"]


[[language]]
name = "javascript"
roots = ["deno.json", "deno.jsonc", "package.json"]
file-types = ["js", "jsx"]
auto-format = true
language-servers = ["deno-lsp"]

