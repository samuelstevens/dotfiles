[language-server.ruff]
command = "uvx"
args = ["ruff", "server", "--preview"]

[language-server.ty]
command = "uvx"
args= ["ty", "server"]

[language-server.ty.config]
inlayHints = { variableTypes = false, callArgumentNames = false }

[language-server.drafty]
command = "drafty"
args = ["lsp"]

[language-server.tinymist]
command = "tinymist"

[language-server.bash-lsp]
command = "bunx"
args = ["--bunx", "bash-language-server", "start"]

[language-server.copilot]
command = "copilot-language-server"
args = ["--stdio"]

[language-server.copilot.config]
editorPluginInfo = { name = "helix-inline-completion", version = "0.1.0" }

[language-server.copilot.config.github.copilot]
enable = { "*" = true }
advanced = {}

[language-server.copilot.config.telemetry]
telemetryLevel = "off"

[language-server.deno-lsp]
command = "deno"
args = ["lsp"]
config.deno.enable = true

#############
# Languages #
#############

[[language]]
name = "python"
language-servers = ["ruff", "ty", "copilot"]
auto-format = true


[[language]]
name = "markdown"
language-servers = ["drafty", "copilot"]


[[language]]
name = "latex"
language-servers = ["drafty", "texlab", "copilot"]


[[language]]
name = "typst"
language-servers = ["drafty", "tinymist", "copilot"]


[[language]]
name = "bash"
language-servers = ["bash-lsp", "copilot"]


[[language]]
name = "rust"
language-servers = ["rust-analyzer", "copilot"]


[[language]]
name = "go"
# Install golangci-lint-langserver with:
# go install github.com/nametake/golangci-lint-langserver@latest
language-servers = ["gopls", "golangci-lint-lsp", "copilot"]


[[language]]
name = "typescript"
roots = ["deno.json", "deno.jsonc", "package.json"]
file-types = ["ts", "tsx"]
auto-format = true
language-servers = ["deno-lsp"]


[[language]]
name = "javascript"
roots = ["deno.json", "deno.jsonc", "package.json"]
file-types = ["js", "jsx"]
auto-format = true
language-servers = ["deno-lsp"]
