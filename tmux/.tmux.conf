set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g extended-keys-format csi-u

# rebind prefix key from C-b to C-a
unbind-key C-b
set-option -g prefix C-a
# explained here https://stackoverflow.com/questions/61532749/tmux-remapping-prefix-key
# if you press C-a (once) tmux captures it, then when you press C-a (second), you sell tmux to just send it to the underlying window
bind-key C-a send-prefix

# make it easier to split windows
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
# can accidentally include shift
bind-key _ split-window -v -c "#{pane_current_path}" 

unbind '"'
unbind %

# make it easy to reload .tmux.conf
bind-key r source-file ~/.tmux.conf

# make switching panes vim-like
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key > command-prompt -p "send pane to:" "join-pane -t '%%'"

bind-key g popup -E -w 100% -h 100% -d '#{pane_current_path}' lazygit
bind-key e popup -E -w 100% -h 100% -d '#{pane_current_path}' $EDITOR

set -g mouse on
bind-key -N "For smooth scrolling" -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -N "For smooth scrolling" -T copy-mode WheelDownPane send-keys -X scroll-down

# vim performance issue
set-option -s escape-time 10

# vim focus events (supports FocusGained and FocusLost autocommand events)
set -g focus-events on

# Kitty focuses the terminal window when a desktop notification is clicked.
# The Pi kitty-notify extension records its pane here before notifying; this
# one-shot handoff also works when this tmux server is reached over SSH.
set-hook -g client-focus-in 'if-shell -F "#{@kitty_notify_pane}" "run-shell -C \"switch-client -t \\\"#{@kitty_notify_pane}\\\" ; set-option -gu @kitty_notify_pane\""'

# status line
set -g status-style bg=default
set -g status-style fg=colour242
set -g status-left ''
set -g status-right-length 60
set -g status-right '#[fg=red]Session: #S  #[fg=green]Window: #I (#F)  #[fg=blue]Pane: #P'

set-window-option -g window-status-current-style fg=red
set-window-option -g window-status-format '(#I) #W '
set-window-option -g window-status-current-format '(#I) #W ' 

# window numbering
set -g base-index 1

# pane numbering
setw -g pane-base-index 1

# Use fish as the login shell for new panes so Fish config is loaded normally.
set-option -g default-shell $HOME/.local/bin/fish

set -g allow-passthrough all
set -g extended-keys on
set -g extended-keys-format csi-u

# Use a clipboard
set -g set-clipboard on
